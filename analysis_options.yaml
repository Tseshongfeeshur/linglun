include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - unnecessary_type_name_in_constructor
    - prefer_const_constructors
    - omit_local_variable_types

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

plugins:
  riverpod_lint: ^3.2.0